[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marketpilot"
version = "0.1.0"
description = "MarketPilot quantitative investing framework"
requires-python = ">=3.11"

dependencies = [
    "pandas",
    "numpy",
    "yfinance",
]

[tool.setuptools.packages.find]
include = ["marketpilot*"]